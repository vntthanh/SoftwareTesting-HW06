name: Newman full API suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman:
    name: Pools A, B, and C (241 reviewed cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out test repository
        uses: actions/checkout@v4

      - name: Check out pinned EShop SUT
        uses: actions/checkout@v4
        with:
          repository: ttbhanh/eshop-sut
          ref: 85af3ba875c88283615e22cb108f13e2fccaf0e9
          path: sut

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/backend/package-lock.json

      - name: Install Newman and SUT dependencies
        run: |
          npm ci
          npm ci --prefix sut/backend

      - name: Start SUT and wait for port 3000
        shell: bash
        run: |
          cd sut/backend
          nohup node server.js > "$RUNNER_TEMP/eshop-sut.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/eshop-sut.log"
          exit 1

      - name: Run every reviewed API test case
        shell: bash
        run: |
          mkdir -p reports/ci
          pool_a_status=0
          pool_b_status=0
          pool_c_status=0

          python3 postman/seed_pool_a_fixtures.py --sut-dir sut || pool_a_status=$?
          if [[ $pool_a_status -eq 0 ]]; then
            npx newman run postman/pool-a-forgot-password.postman_collection.json \
              --env-var baseUrl=http://127.0.0.1:3000 \
              --env-var studentId=23127261 \
              --reporters cli,json,htmlextra \
              --reporter-json-export reports/ci/pool-a.json \
              --reporter-htmlextra-export reports/ci/pool-a.html || pool_a_status=$?
          fi

          python3 postman/run_pool_b_with_fixtures.py \
            --sut-dir sut \
            --newman-command npx newman \
            --newman-arg=--reporters \
            --newman-arg=cli,json,htmlextra \
            --newman-arg=--reporter-json-export \
            --newman-arg=reports/ci/pool-b.json \
            --newman-arg=--reporter-htmlextra-export \
            --newman-arg=reports/ci/pool-b.html || pool_b_status=$?

          python3 postman/run_pool_c_with_fixtures.py \
            --sut-dir sut \
            --newman-command npx newman \
            --newman-arg=--reporters \
            --newman-arg=cli,json,htmlextra \
            --newman-arg=--reporter-json-export \
            --newman-arg=reports/ci/pool-c.json \
            --newman-arg=--reporter-htmlextra-export \
            --newman-arg=reports/ci/pool-c.html || pool_c_status=$?

          echo "Pool A exit: $pool_a_status"
          echo "Pool B exit: $pool_b_status"
          echo "Pool C exit: $pool_c_status"
          [[ $pool_a_status -eq 0 && $pool_b_status -eq 0 && $pool_c_status -eq 0 ]]

      - name: Collect SUT log
        if: always()
        shell: bash
        run: |
          mkdir -p reports/ci
          if [[ -f "$RUNNER_TEMP/eshop-sut.log" ]]; then
            cp "$RUNNER_TEMP/eshop-sut.log" reports/ci/eshop-sut.log
          fi

      - name: Upload complete Newman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-full-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 30
